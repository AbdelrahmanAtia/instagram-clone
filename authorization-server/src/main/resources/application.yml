server.port: 9999

spring:
  application.name: auth-server
  cloud.config.enabled: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml


eureka.client.enabled: false  # disable eureka


# Tracing config
spring.zipkin.sender.type: rabbit
spring.sleuth.sampler.probability: 1.0

---
spring.config.activate.on-profile: prod
    
spring.datasource:
  url: jdbc:mysql://mysql/user-info-db 
  username: root
  password: rootpwd

issuer.uri: http://localhost:${server.port}
---
spring.config.activate.on-profile: local


spring.datasource:
  url: jdbc:mysql://localhost/user-info-db
  username: root
  password: rootpwd

issuer.uri: http://localhost:${server.port}