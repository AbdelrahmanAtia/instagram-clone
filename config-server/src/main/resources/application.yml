server.port: 8888

spring:
  profiles:
    active: native

  security:
    user:
      name: ${CONFIG_SERVER_USR}
      password: ${CONFIG_SERVER_PWD}

# WARNING: Exposing all management endpoints over http should only be used during development, must be locked down in production!
management:
  endpoint:
    health.show-details: "ALWAYS"
  endpoints:
    web.exposure.include: "*"

logging.level.root: info

---
spring:
  config.activate.on-profile: local
  cloud.config.server.native.searchLocations: ./config-repo

# TODO: improve to retrieve such values from vault..also do the same for the other credentials in .env file
# TODO:i had to add the encrypt key here as I don't know why the encrypt key in the .env file is not working..i think the
#      property name is different..is it also not working in docker ??
encrypt:
  key: my-very-secure-encrypt-key

---
spring:
  config.activate.on-profile: docker
  cloud.config.server.native.searchLocations: file:/config-repo